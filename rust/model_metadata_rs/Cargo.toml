[package]
name = "model_metadata_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "model_metadata_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
lazy_static = "1.4"
url = "1"
