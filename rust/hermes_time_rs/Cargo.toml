[package]
name = "hermes_time_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "_hermes_time_rs"
crate-type = ["cdylib"]

[package.metadata.maturin]
name = "hermes_time_rs"

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
chrono = { version = "0.4", features = ["std"] }
chrono-tz = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
dirs = "5"
once_cell = "1"
parking_lot = "0.12"
