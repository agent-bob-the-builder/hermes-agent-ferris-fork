[workspace]
resolver = "2"
members = [
    "compressor",
    "fuzzy_match_rs",
    "hermes_state_rs",
    "model_tools_rs",
    "prompt_builder_rs",
    "skin_engine_rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tiktoken-rs = "0.5"
lazy_static = "1.4.0"
rayon = "1.10"
regex = "1"
once_cell = "1"
rand = "0.8"
